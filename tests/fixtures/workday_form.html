<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test Workday-style form</title></head>
<body>
<!-- Like Workday's "My Experience" step: sections behind Add buttons, Month / Year boxes, search boxes
     that only search on Enter, a skills box that takes several picks, and an "Upload a file" resume box. -->
<div data-automation-id="applyFlowPage">
  <h2>My Experience</h2>

  <h3>Work Experience</h3>
  <div id="work" role="group" aria-label="Work Experience"></div>
  <button type="button" id="addWork" onclick="addWork()">Add</button>

  <h3>Education</h3>
  <div id="edu"></div>
  <button type="button" id="addEdu" onclick="addEdu()">Add</button>

  <h3>Skills</h3>
  <div data-automation-id="multiSelectContainer">
    <input id="skills" placeholder="Type to Add Skills" data-automation-id="searchBox" onkeydown="if (event.key === 'Enter') setTimeout(() => search(this, SKILLS), 1800)">
    <ul class="picked" id="pickedSkills"></ul>
  </div>

  <h3>Resume/CV</h3>
  <label for="file">Upload a file (5MB max)</label>
  <input type="file" id="file" data-automation-id="file-upload-input-ref">
</div>
<div id="popup"></div>

<script>
const SKILLS = ['SQL', 'SQL Server', 'Jira', 'Visio', 'Agile Methodologies'];
const SCHOOLS = ['The Ohio State University', 'Ohio University'];
let nWork = 0, nEdu = 0;
function field(id, label, extra) {
  return `<div data-automation-id="formField-${id}"><label for="${id}">${label}</label><input id="${id}" ${extra || ''}></div>`;
}
// Like Workday: the "From" label is a legend (not a section heading), around a group of Month / Year boxes.
function dateGroup(id, label) {
  return `<fieldset><legend><label>${label}</label></legend>
    <div role="group" aria-labelledby="${id}-hidden"><span id="${id}-hidden" hidden>current value is</span>
    <input id="${id}-m" aria-label="Month" data-automation-id="dateSectionMonth-input">
    <input id="${id}-y" aria-label="Year" data-automation-id="dateSectionYear-input"></div></fieldset>`;
}
function addWork() {
  nWork++;
  const n = nWork, box = document.createElement('div');
  box.innerHTML = `<h4>Work Experience ${n}</h4>` + field(`title${n}`, 'Job Title*') + field(`company${n}`, 'Company*') +
    `<label><input type="checkbox" id="current${n}"> I currently work here</label>` +
    dateGroup(`from${n}`, 'From*') + dateGroup(`to${n}`, 'To') +
    `<label for="desc${n}">Role Description</label><textarea id="desc${n}"></textarea>`;
  document.getElementById('work').appendChild(box);
  document.getElementById('addWork').textContent = 'Add Another';
}
function addEdu() {
  nEdu++;
  const n = nEdu, box = document.createElement('div');
  box.innerHTML = `<h4>Education ${n}</h4>` +
    field(`school${n}`, 'School or University*', `data-automation-id="searchBox" onkeydown="if (event.key === 'Enter') search(this, SCHOOLS)"`) +
    `<span id="deg${n}-l">Degree*</span><button type="button" id="degree${n}" aria-haspopup="listbox" aria-labelledby="deg${n}-l"
       onclick="listFor(this, ['Bachelor of Arts', 'Bachelor of Science', 'Master of Science'])">Select One</button>`;
  document.getElementById('edu').appendChild(box);
  document.getElementById('addEdu').textContent = 'Add Another';
}
// Choices show up only after Enter, as Workday's "promptOption" items.
function search(input, list) {
  const t = input.value.toLowerCase();
  showOptions(list.filter(x => x.toLowerCase().includes(t)), choice => {
    if (input.id === 'skills') {
      const li = document.createElement('li'); li.textContent = choice;
      document.getElementById('pickedSkills').appendChild(li); input.value = '';
    } else input.value = choice;
  });
}
function listFor(button, list) {
  showOptions(list, choice => { button.textContent = choice; });
}
function showOptions(list, onPick) {
  const popup = document.getElementById('popup');
  popup.innerHTML = '';
  for (const x of list) {
    const d = document.createElement('div');
    d.setAttribute('data-automation-id', 'promptOption');
    d.textContent = x;
    d.onclick = () => { onPick(x); popup.innerHTML = ''; };
    popup.appendChild(d);
  }
}
</script>
</body>
</html>
