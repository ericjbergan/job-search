<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test application form</title></head>
<body>
<form onsubmit="return false">
  <label for="fn">First Name *</label> <input id="fn" name="firstName" required>
  <label>Last name <input name="lastName"></label>
  <div><span>Email Address</span><input type="email" name="contact_email"></div>
  <input aria-label="Phone number" type="tel" name="ph">
  <input placeholder="City" name="addr_city">
  <label for="st">State</label>
  <select id="st"><option value="">Select...</option><option value="IN">Indiana</option><option value="OH">Ohio</option></select>
  <label for="pw">Create a password</label> <input id="pw" type="password">
  <label for="ssn">Social Security Number</label> <input id="ssn">
  <label for="cv">Upload your resume</label> <input id="cv" type="file">

  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth" value="y"> Yes</label>
    <label><input type="radio" name="auth" value="n"> No</label>
  </fieldset>
  <div class="q">
    <p>Will you now or in the future require sponsorship?</p>
    <label><input type="radio" name="spons" value="1"> Yes</label>
    <label><input type="radio" name="spons" value="0"> No</label>
  </div>
  <label for="why">Why are you interested in this role?</label>
  <textarea id="why"></textarea>
  <label for="already">Middle name</label> <input id="already" value="Ann">

  <div><p>Which tools have you used?</p>
    <label><input type="checkbox" name="tools" value="jira"> Jira</label>
    <label><input type="checkbox" name="tools" value="sql"> SQL</label>
    <label><input type="checkbox" name="tools" value="sap"> SAP</label>
  </div>
  <label><input type="checkbox" id="agree"> I agree to the terms and privacy policy</label>

  <span id="genderLbl">Gender</span>
  <button type="button" id="gender" aria-haspopup="listbox" aria-labelledby="genderLbl"
          onclick="document.getElementById('genderList').hidden = false">Select One</button>
  <ul id="genderList" role="listbox" hidden>
    <li role="option" onclick="pick(this)">Female</li>
    <li role="option" onclick="pick(this)">Male</li>
    <li role="option" onclick="pick(this)">I do not wish to answer</li>
  </ul>
  <div class="question">
    <label>Are you willing to work remotely?</label>
    <div><button type="button" onclick="answer('yes', this)">Yes</button><button type="button" onclick="answer('no', this)">No</button></div>
  </div>
  <input type="hidden" id="remoteAns">

  <label for="loc">Location</label>
  <input id="loc" role="combobox" aria-haspopup="listbox" placeholder="Start typing..." oninput="suggest(this.value)">
  <ul id="locList" role="listbox"></ul>
  <input type="hidden" name="token" value="x">
  <button type="submit">Submit application</button>
</form>
<iframe srcdoc="<label for='li'>LinkedIn Profile</label><input id='li'>"></iframe>
<script>
function answer(value, button) {
  document.getElementById('remoteAns').value = value;
  button.className = 'selected';
}
// Like real place pickers: knows full state names only, and only after typing the town.
const PLACES = ['Newark, New Jersey, United States', 'Newark, Ohio, United States'];
function suggest(text) {
  const list = document.getElementById('locList');
  const t = text.toLowerCase();
  list.innerHTML = '';
  for (const p of PLACES.filter(p => t && p.toLowerCase().startsWith(t))) {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.textContent = p;
    li.onclick = () => { document.getElementById('loc').value = p; list.innerHTML = ''; };
    list.appendChild(li);
  }
}
function pick(li) {
  document.getElementById('gender').textContent = li.textContent;
  document.getElementById('genderList').hidden = true;
}
</script>
</body>
</html>
